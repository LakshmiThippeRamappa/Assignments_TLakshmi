<div class="register-container">
  <div class="register-card">
    <h2 class="title">Register User</h2>

    <form (ngSubmit)="onRegister()" class="form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="user.uname" name="uname" required class="form-control"/>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" required class="form-control"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="user.pwd" name="pwd" required class="form-control"/>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="user.role" name="role" class="form-control">
          <option value="STUDENT">STUDENT</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <hr />

    <!-- ✅ Include login inside same page -->
    <app-loginUser></app-loginUser>
  </div>
</div>
