<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Users</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    a { margin-right: 15px; text-decoration: none; color: blue; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <p>view-user works!</p>
  <a href="/add-user">Add User</a>
  <a href="/edit-user">Edit User</a>
  <a href="/delete-user">Delete User</a>  <br>


  <div *ngIf="errorMessage" style="color: red;">
  {{ errorMessage }}
</div>

<div>
  Total Users: {{ users.length }}
</div>

<div *ngIf="!users.length && !errorMessage">
  Loading 
  ...
</div>

<div *ngIf="users.length > 0" class="user-list">
  <div class="user-header">
    <strong>ID</strong>
    <strong>Name</strong>
    <strong>Email</strong>
    <strong>Password</strong>
    <strong>Role</strong>
    <strong>Actions</strong>
  </div>

  <div *ngFor="let user of users" class="user-row">
    <div>{{ user.id }}</div>
    <div>{{ user.uname }}</div>
    <div>{{ user.email }}</div>
    <div>{{ user.pwd }}</div>
    <div>{{ user.role }}</div>
    <!-- <div> <button (click)="editCustomer(customer.id)">Edit </button></div>
     <div> <button (click)="deleteCustomer(customer.id)">Delete </button></div> -->
  </div>
</div>

<br />







  <a href=" ">Back to Main Menu</a>

</body>
</html>
