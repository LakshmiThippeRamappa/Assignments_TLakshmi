<h2>Edit Course</h2>

<!-- Success/Error message -->
<div *ngIf="message" class="alert">
  {{ message }}
</div>

<form (ngSubmit)="updateCourse()" class="course-form">
  <div class="form-group">
    <label>Title:</label>
    <input [(ngModel)]="course.title" name="title" required>
  </div>

  <div class="form-group">
    <label>Description:</label>
    <input [(ngModel)]="course.description" name="description" required>
  </div>

  <div class="form-group">
    <label>Teacher ID:</label>
    <input [(ngModel)]="course.teacherId" name="teacherId" type="number" required>
  </div>

  <button type="submit">Update</button>
  <button type="button" routerLink="/view-courses" class="back-btn">Cancel</button>
</form>
