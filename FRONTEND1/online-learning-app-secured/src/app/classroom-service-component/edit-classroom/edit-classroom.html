<div class="update-container">
  <h2>Update Classroom</h2>

  <!-- Loading indicator -->
  <div *ngIf="loading" class="loading">
    Loading classroom details...
  </div>

    <!-- Status messages -->
  <div *ngIf="message" [ngClass]="{'success-msg': messageType==='success', 'error-msg': messageType==='error'}">
    {{ message }}
  </div>


  <!-- Update Form -->
  <form (ngSubmit)="updateClassroom()" *ngIf="!loading">
    <div class="form-group">
      <label for="courseId">Course ID</label>
      <input 
        id="courseId"
        type="number"
        [(ngModel)]="classroom.courseId"
        name="courseId"
        required
      />
    </div>

    <div class="form-group">
      <label for="sessionDateTime">Session Date & Time</label>
      <input 
        id="sessionDateTime"
        type="datetime-local"
        [(ngModel)]="classroom.sessionDateTime"
        name="sessionDateTime"
        required
      />
    </div>

    <div class="form-group">
      <label for="sessionLink">Session Link</label>
      <input 
        id="sessionLink"
        type="url"
        [(ngModel)]="classroom.sessionLink"
        name="sessionLink"
        placeholder="https://example.com/session"
        required
      />
    </div>

    <div class="button-group">
      <button type="submit" class="btn btn-primary">Update</button>
      <button type="button" class="btn btn-secondary" [routerLink]="['/view-classrooms']">
        Cancel
      </button>
    </div>
  </form>
</div>
