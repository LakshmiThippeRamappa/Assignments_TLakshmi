<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment List</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h2>Payment List</h2>
    <table>
        <tr>
    <th>ID</th>
    <th>Order ID</th>
    <th>Amount</th>
    <th>Status</th>
    <th>Payment Date</th>
    <th>Actions</th>
</tr>
<tr th:each="p : ${payments}">
    <td th:text="${p.id}"></td>
    <td th:text="${p.orderId}"></td>
    <td th:text="${p.amount}"></td>
    <td th:text="${p.status}"></td>
    <td th:text="${p.paymentDate}"></td>
    <td>
        <a th:href="@{/payment/edit/{id}(id=${p.id})}">Edit</a> |
        <a th:href="@{/payment/delete/{id}(id=${p.id})}" 
           onclick="return confirm('Are you sure you want to delete this payment?');">
           Delete
        </a>
    </td>
</tr>

    </table>
</body>
</html>
