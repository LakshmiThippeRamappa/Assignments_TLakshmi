<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Payment</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h2>Add Payment</h2>
    <form th:action="@{/payment/save}" th:object="${payment}" method="post">
        <label>Order ID:</label><br/>
        <input type="number" th:field="*{orderId}" required /><br/>

        <label>Amount (₹):</label><br/>
        <input type="number" step="0.01" th:field="*{amount}" required /><br/>

        <label>Status:</label><br/>
        <input type="text" th:field="*{status}" placeholder="e.g. PAID / PENDING" required /><br/>

        <label>Payment Date (YYYY-MM-DD):</label><br/>
        <input type="text" th:field="*{paymentDate}" placeholder="2025-08-04" required /><br/>

        <button type="submit">Save</button>
    </form>
</body>
</html>
